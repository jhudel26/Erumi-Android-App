name: Release Android APK to Cloudflare R2

on:
  release:
    types: [published]

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > release-keystore.jks

      - name: Build signed release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          UPDATE_MANIFEST_URL: ${{ secrets.UPDATE_MANIFEST_URL }}
          UPDATE_PUBLIC_KEY: ${{ secrets.UPDATE_PUBLIC_KEY }}
        run: |
          ./gradlew assembleRelease --no-daemon \
            -PUPDATE_MANIFEST_URL="$UPDATE_MANIFEST_URL" \
            -PUPDATE_PUBLIC_KEY="$UPDATE_PUBLIC_KEY"

      - name: Compute APK metadata & generate update.json
        id: meta
        env:
          UPDATE_DOMAIN: ${{ secrets.UPDATE_DOMAIN }}
          VERSION_TAG: ${{ github.event.release.tag_name }}
        run: |
          APK_PATH="app/build/outputs/apk/release/app-release.apk"
          SHA256=$(sha256sum "$APK_PATH" | awk '{print $1}')
          SIZE=$(stat -c%s "$APK_PATH")
          VERSION_NAME="${VERSION_TAG#v}"
          VERSION_CODE=$(grep -E "versionCode\s*=" app/build.gradle.kts | head -n1 | grep -oE "[0-9]+")
          PUBLISHED_AT=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          APK_NAME="erumi-v${VERSION_NAME}.apk"
          cp "$APK_PATH" "$APK_NAME"
          cat <<EOF > update.json
          {
            "versionCode": ${VERSION_CODE},
            "versionName": "${VERSION_NAME}",
            "apkUrl": "https://${UPDATE_DOMAIN}/android/releases/${APK_NAME}",
            "sha256": "${SHA256}",
            "mandatory": false,
            "minimumSupportedVersion": 5,
            "releaseNotes": ["Release ${VERSION_NAME}"],
            "publishedAt": "${PUBLISHED_AT}",
            "fileSizeBytes": ${SIZE}
          }
          EOF
          echo "apk_name=$APK_NAME" >> "$GITHUB_OUTPUT"

      - name: Upload APK to Cloudflare R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          aws s3 cp "${{ steps.meta.outputs.apk_name }}" "s3://${R2_BUCKET}/android/releases/${{ steps.meta.outputs.apk_name }}" \
            --endpoint-url "$R2_ENDPOINT" \
            --content-type "application/vnd.android.package-archive"

      - name: Upload update.json to Cloudflare R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          aws s3 cp update.json "s3://${R2_BUCKET}/android/update.json" \
            --endpoint-url "$R2_ENDPOINT" \
            --content-type "application/json" \
            --cache-control "no-cache, no-store, must-revalidate"
